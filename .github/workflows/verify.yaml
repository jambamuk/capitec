name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: test-results/
          retention-days: 7
