services:
  app:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      DOWNLOAD_LINK_TTL: PT3S
      DATABASE_PASSWORD: local-demo-database
      DEMO_OPERATOR_PASSWORD: operator-demo
      DEMO_CUSTOMER_PASSWORD: customer-demo
      FRAUD_ENABLED: "true"
      STATEMENTS_ENABLED: "true"
  postgres:
    environment:
      POSTGRES_PASSWORD: local-demo-database
  bank-source:
    environment:
      EMIT_INTERVAL_MS: "0"
  card-source:
    environment:
      EMIT_INTERVAL_MS: "0"
  wallet-source:
    environment:
      EMIT_INTERVAL_MS: "0"
  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      BASE_URL: http://app:8080
      DATABASE_URL: postgres://finance:local-demo-database@postgres:5432/finance
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./test-results:/artifacts
    depends_on:
      app: {condition: service_healthy}
      bank-source: {condition: service_started}
      card-source: {condition: service_started}
      wallet-source: {condition: service_started}
