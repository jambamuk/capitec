spring:
  application:
    name: financial-demo
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DATABASE_USER:finance}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  liquibase:
    change-log: classpath:db/changelog/master.yaml
    contexts: ${DATA_CONTEXT:production}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
      properties:
        allow.auto.create.topics: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 10000
    listener:
      ack-mode: record
      concurrency: 2
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: UPDATE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: OPERATOR
      group:
        readiness:
          include: readinessState,db
app:
  storage: ${STATEMENT_STORAGE:./data/statements}
  link-ttl: ${DOWNLOAD_LINK_TTL:PT5M}
  fraud-enabled: ${FRAUD_ENABLED:true}
  statements-enabled: ${STATEMENTS_ENABLED:true}
  clock-zone: Africa/Johannesburg
springdoc:
  swagger-ui:
    path: /api-docs
